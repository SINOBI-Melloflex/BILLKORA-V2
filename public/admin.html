<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BillKora - Admin</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="premium.css"><link rel="stylesheet" href="erp.css"><style>#v{opacity:1!important;filter:none!important}body.gld::before{content:"";position:fixed;top:0;left:0;height:3px;width:100%;background:linear-gradient(90deg,#00e5ff,#1e6bff,#19f5a6);z-index:99999;animation:gldbar 1s ease-in-out infinite}@keyframes gldbar{0%{transform:scaleX(0);transform-origin:left}100%{transform:scaleX(1);transform-origin:left}}</style></head><body>
<div class="app"><div class="side"><div class="logo"><img src="logo.png" alt="" style="height:40px;border-radius:8px"><div>BillKora<small>ISP Admin Panel</small></div></div>
<a data-v="dashboard" href="#dashboard"><i data-i="home"></i>Dashboard</a><a data-v="customers" href="#customers"><i data-i="users"></i>Customers</a><a data-v="requests" href="#requests"><i data-i="mail"></i>Requests</a><a data-v="packages" href="#packages"><i data-i="box"></i>Packages</a><a data-v="billing" href="#billing"><i data-i="file"></i>Billing &amp; Invoices</a><a data-v="payments" href="#payments"><i data-i="card"></i>Payments</a><a data-v="network" href="#network"><i data-i="server"></i>Network/Devices</a><a data-v="support" href="#support"><i data-i="hp"></i>Support</a><a data-v="reports" href="#reports"><i data-i="chart"></i>Reports</a><a data-v="settings" href="#settings"><i data-i="gear"></i>Settings</a>
<a href="#" onclick="logout();return false" style="margin-top:30px"><i data-i="out"></i>Logout</a></div>
<div class="main"><div class="top"><h1 id="ttl">Dashboard</h1><div class="r"><button id="bkUpd" type="button" style="margin-right:12px;padding:8px 14px;border:0;border-radius:10px;cursor:pointer;font-weight:600;color:#fff;background:linear-gradient(90deg,#1e6bff,#8b5cf6)">&#8635; Check for update</button><a href="#requests" title="New requests"><i data-i="bell"></i></a><div class="av">A</div><div><b>Admin User</b><div class="muted" id="em"></div></div></div></div><div id="v"></div></div></div>
<script src="app.js"></script>
<script>
var V={},D={};
function P(t,h){$('ttl').textContent=t;$('v').innerHTML=h;$('v').style.opacity='';icons()}
var __gtm;function go(){clearTimeout(__gtm);__gtm=setTimeout(goNow,40)}function goNow(){var c=(location.hash||'#dashboard').slice(1);if(!V[c])c='dashboard';window.GT=(window.GT||0)+1;var __t=window.GT,__v=document.getElementById('v');if(__v)__v.style.opacity='';document.body.classList.add('gld');
 document.querySelectorAll('.side a[data-v]').forEach(function(a){a.classList.toggle('on',a.dataset.v===c)});
 window.GV=__t;var __p;try{__p=V[c]()}finally{window.GV=0}__p.then(function(){document.body.classList.remove('gld')},function(){document.body.classList.remove('gld')});__p.catch(function(e){if(__v)__v.style.opacity='';if(e.message!=='auth')toast(e.message,1)})}
window.onhashchange=go;
api('me').then(function(j){if(j.role!=='admin'){location.href='customer.html';return}$('em').textContent=j.email||'';go()});
function pname(id){var p=(D.p||[]).filter(function(x){return x.id===id})[0];return p?p.name:'-'}
function cname(id){var c=(D.c||[]).filter(function(x){return x.id===id})[0];return c?c.name:'-'}
function spark(a){var mx=Math.max.apply(null,a.concat([1])),n=a.length-1||1,pts=a.map(function(v,i){return Math.round(i*200/n)+','+Math.round(75-v/mx*65)}).join(' ');return '<svg viewBox="0 0 200 80" width="100%"><polygon fill="#1e6bff22" points="0,80 '+pts+' 200,80"/><polyline fill="none" stroke="#1e6bff" stroke-width="3" points="'+pts+'"/></svg>'}
function bars(m,a,b){var mx=Math.max.apply(null,a.concat(b).concat([1])),h='<svg viewBox="0 0 600 220" width="100%">';m.forEach(function(x,i){var x0=20+i*95,ha=a[i]/mx*150,hb=b[i]/mx*150;h+='<rect x="'+x0+'" y="'+(170-ha)+'" width="30" height="'+ha+'" fill="#9bb8f5" rx="3"/><rect x="'+(x0+34)+'" y="'+(170-hb)+'" width="30" height="'+hb+'" fill="#1e6bff" rx="3"/><text x="'+(x0+32)+'" y="192" font-size="11" text-anchor="middle" fill="#5b6b88">'+x.slice(2)+'</text>'});return h+'<rect x="20" y="206" width="10" height="10" fill="#9bb8f5"/><text x="36" y="215" font-size="11" fill="#5b6b88">Billed</text><rect x="90" y="206" width="10" height="10" fill="#1e6bff"/><text x="106" y="215" font-size="11" fill="#5b6b88">Collected</text></svg>'}

V.dashboard=function(){return api('admin/summary').then(function(s){
 var a=s.total?Math.round(s.active/s.total*100):0,b=s.total?Math.round(s.suspended/s.total*100):0;
 P('Dashboard','<div class="grid">'+stat('users','Total Customers',s.total)+stat('wifi','Active Connections',s.active)+stat('clock','New Requests',s.newRequests)+stat('alert','Due Bills',s.dueBills)+'</div>'
 +'<div class="two"><div class="card"><h3>New Customer Requests <a class="lnk" href="#requests">View All</a></h3>'+tbl(['#','Name','Phone','Package','Date','Action'],s.recentRequests.map(function(r,i){return [i+1,esc(r.name),esc(r.phone),esc(r.package),fdate(r.date),'<button class="bd" onclick="appr(\''+r.id+'\')">Approve</button>']}))+'</div>'
 +'<div class="card"><h3>Revenue (This Month)</h3><h2 style="margin:8px 0">'+money(s.revenue)+'</h2>'+spark(s.trend)+'</div></div>'
 +'<div class="two" style="grid-template-columns:1fr 1fr"><div class="card"><h3>Connection Status</h3><div style="display:flex;gap:24px;align-items:center;margin-top:10px"><div class="donut" style="background:conic-gradient(#22b45a 0 '+a+'%,#f5a623 '+a+'% '+(a+b)+'%,#e5484d '+(a+b)+'% 100%)"><b>'+s.total+'</b></div><div style="line-height:2;font-size:14px"><span class="dot" style="background:#22b45a"></span>Active - '+s.active+'<br><span class="dot" style="background:#f5a623"></span>Suspended - '+s.suspended+'<br><span class="dot" style="background:#e5484d"></span>Disconnected - '+s.disconnected+'</div></div></div>'
 +'<div class="card"><h3>Recent Payments <a class="lnk" href="#payments">View All</a></h3>'+tbl(['Customer','Amount','Date'],s.recentPayments.map(function(p){return [esc(p.customer),money(p.amount),fdate(p.date)]}))+'</div></div>')})};
function appr(id){api('admin/requests/'+id+'/approve','POST').then(function(r){box('Customer approved','<p>Login details for the new customer:</p><p><b>Username:</b> '+esc(r.username)+'<br><b>Password:</b> '+esc(r.password)+'</p><p class="muted">Give these to the customer. They can change the password after login.</p>');go()}).catch(function(e){toast(e.message,1)})}

V.customers=function(){return Promise.all([api('admin/customers'),api('admin/packages')]).then(function(r){D.c=r[0];D.p=r[1];
 P('Customers','<div class="card"><div class="bar2"><input placeholder="Search name, phone, ID..." oninput="fillC(this.value)"><button class="btn" onclick="editC()"><i data-i="plus"></i> Add Customer</button></div><div id="ct"></div></div>');fillC('')})};
function fillC(q){q=q.toLowerCase();$('ct').innerHTML=tbl(['ID','Name','Phone','Package','Status','Actions'],D.c.filter(function(c){return (c.name+c.phone+c.cid+c.username).toLowerCase().indexOf(q)>-1}).map(function(c){return [c.cid,esc(c.name),esc(c.phone),esc(pname(c.packageId)),bdg(c.status),'<div class="act"><button class="btn sm" onclick="editC(\''+c.id+'\')">Edit</button><button class="btn sm o2" onclick="newInv(\''+c.id+'\')">Bill</button><button class="btn sm red" onclick="delC(\''+c.id+'\')">Delete</button></div>']}))}
function editC(id){var c=id?D.c.filter(function(x){return x.id===id})[0]:{status:'active',packageId:D.p[0]&&D.p[0].id};
 form(id?'Edit Customer':'Add Customer',[{k:'name',l:'Full Name',r:1},{k:'phone',l:'Phone',r:1},{k:'email',l:'Email'},{k:'address',l:'Address'},{k:'nid',l:'NID / ID No.'},{k:'packageId',l:'Package',t:'select',o:D.p.map(function(p){return [p.id,p.name+' - '+money(p.price)]})},{k:'status',l:'Connection Status',t:'select',o:[['active','Active'],['suspended','Suspended'],['disconnected','Disconnected']]},{k:'usage',l:'Usage this month (GB)',t:'number'},{k:'username',l:'Login username',p:'auto'},{k:'pass',l:'Password',p:id?'leave blank to keep':'blank = phone number'}],c,function(d){
 return api('admin/customers'+(id?'/'+id:''),id?'PUT':'POST',d).then(function(r){return function(){if(r.password)box('Customer added','<p><b>Username:</b> '+esc(r.username)+'<br><b>Password:</b> '+esc(r.password)+'</p>');else toast('Saved');go()}})})}
function delC(id){sure('Delete this customer and all their bills, payments and tickets?',function(){A('admin/customers/'+id,'DELETE',null,'Deleted')})}
function newInv(cid){var f=[];if(!cid)f.push({k:'customerId',l:'Customer',t:'select',o:D.c.map(function(c){return [c.id,c.cid+' - '+c.name]})});f.push({k:'month',l:'Month (YYYY-MM)',r:1},{k:'amount',l:'Amount (blank = package price)',t:'number'});
 form('Create Invoice',f,{month:cm()},function(d){if(cid)d.customerId=cid;return api('admin/invoices','POST',d).then(done('Invoice created'))})}

V.requests=function(){return api('admin/requests').then(function(r){P('Customer Requests','<div class="card">'+tbl(['Name','Phone','Address','Package','Note','Date','Status','Action'],r.slice().reverse().map(function(x){return [esc(x.name),esc(x.phone),esc(x.address),esc(x.package),esc(x.note),fdate(x.date),bdg(x.status),(x.status==='pending'?'<button class="bd" onclick="appr(\''+x.id+'\')">Approve</button> <button class="bd r" onclick="rej(\''+x.id+'\')">Reject</button> ':'')+'<button class="bd g" onclick="delR(\''+x.id+'\')">Delete</button>']}))+'</div>')})};
function rej(id){sure('Reject this request?',function(){A('admin/requests/'+id+'/reject','POST',null,'Rejected')})}
function delR(id){sure('Delete this request?',function(){A('admin/requests/'+id,'DELETE',null,'Deleted')})}

V.packages=function(){return Promise.all([api('admin/packages'),api('admin/customers')]).then(function(r){D.p=r[0];
 P('Packages','<div class="bar2"><button class="btn" onclick="editP()"><i data-i="plus"></i> Add Package</button></div><div class="grid">'+r[0].map(function(p){var n=r[1].filter(function(c){return c.packageId===p.id}).length;return '<div class="card pk"><h3>'+esc(p.name)+'</h3><p>'+esc(p.desc)+'</p><h2>'+money(p.price)+'<small> /mo</small></h2><p>'+n+' customers</p><div class="act" style="justify-content:center;margin-top:10px"><button class="btn sm" onclick="editP(\''+p.id+'\')">Edit</button><button class="btn sm red" onclick="delP(\''+p.id+'\')">Delete</button></div></div>'}).join('')+'</div>')})};
function editP(id){var p=id?D.p.filter(function(x){return x.id===id})[0]:{};form(id?'Edit Package':'Add Package',[{k:'name',l:'Package name (e.g. 20 Mbps)',r:1},{k:'speed',l:'Speed (Mbps)',t:'number'},{k:'price',l:'Monthly price',t:'number',r:1},{k:'desc',l:'Description'}],p,function(d){return api('admin/packages'+(id?'/'+id:''),id?'PUT':'POST',d).then(done())})}
function delP(id){sure('Delete this package?',function(){A('admin/packages/'+id,'DELETE',null,'Deleted')})}

V.billing=function(){return Promise.all([api('admin/invoices'),api('admin/customers')]).then(function(r){D.i=r[0];D.c=r[1];
 P('Billing & Invoices','<div class="card"><div class="bar2"><select id="fl" onchange="fillI()"><option value="">All invoices</option><option value="due">Due</option><option value="paid">Paid</option></select><button class="btn" onclick="genI()">Generate bills for this month</button><button class="btn o2" onclick="newInv()"><i data-i="plus"></i> New Invoice</button></div><div id="it"></div></div>');fillI()})};
function fillI(){var f=$('fl').value;$('it').innerHTML=tbl(['Invoice','Customer','Month','Amount','Due Date','Status','Actions'],D.i.filter(function(i){return !f||i.status===f}).map(function(i){return [i.no,esc(i.customer),i.month,money(i.amount),i.due,bdg(i.status),'<div class="act"><button class="btn sm o2" onclick="viewI(\''+i.id+'\')">View</button>'+(i.status==='due'?'<button class="btn sm" onclick="payI(\''+i.id+'\')">Mark Paid</button>':'')+'<button class="btn sm red" onclick="delI(\''+i.id+'\')">Delete</button></div>']}))}
function viewI(id){invBox(D.i.filter(function(i){return i.id===id})[0])}
function payI(id){form('Record Payment',[{k:'method',l:'Payment method',t:'select',o:METHODS}],{},function(d){d.invoiceId=id;return api('admin/payments','POST',d).then(done('Payment recorded'))},'Mark as Paid')}
function genI(){sure('Create this month\'s bill for every customer?',function(){api('admin/invoices/generate','POST').then(function(r){toast(r.created+' invoices created');go()})})}
function delI(id){sure('Delete this invoice?',function(){A('admin/invoices/'+id,'DELETE',null,'Deleted')})}

V.payments=function(){return Promise.all([api('admin/payments'),api('admin/invoices')]).then(function(r){D.i=r[1];
 P('Payments','<div class="card"><div class="bar2"><button class="btn" onclick="recP()"><i data-i="plus"></i> Record Payment</button></div>'+tbl(['Receipt','Customer','Invoice','Amount','Method','Date'],r[0].map(function(p){var i=r[1].filter(function(x){return x.id===p.invoiceId})[0];return [p.no,esc(p.customer),i?i.no:'-',money(p.amount),esc(p.method),fdate(p.date)]}))+'</div>')})};
function recP(){var due=D.i.filter(function(i){return i.status==='due'});if(!due.length){toast('No due invoices',1);return}
 form('Record Payment',[{k:'invoiceId',l:'Due invoice',t:'select',o:due.map(function(i){return [i.id,i.no+' - '+i.customer+' - '+money(i.amount)]})},{k:'method',l:'Payment method',t:'select',o:METHODS}],{},function(d){return api('admin/payments','POST',d).then(done('Payment recorded'))},'Record')}

V.network=function(){return Promise.all([api('admin/customers'),api('admin/devices'),api('admin/packages')]).then(function(r){D.c=r[0];D.d=r[1];D.p=r[2];
 P('Network / Devices','<div class="card"><h3>Customer Connections</h3>'+tbl(['ID','Customer','Package','Status','Change status'],r[0].map(function(c){return [c.cid,esc(c.name),esc(pname(c.packageId)),bdg(c.status),'<div class="act"><button class="btn sm" onclick="setS(\''+c.id+'\',\'active\')">Activate</button><button class="btn sm o2" onclick="setS(\''+c.id+'\',\'suspended\')">Suspend</button><button class="btn sm red" onclick="setS(\''+c.id+'\',\'disconnected\')">Disconnect</button></div>']}))+'</div>'
 +'<div class="card" style="margin-top:16px"><h3>Devices</h3><div class="bar2"><button class="btn" onclick="editD()"><i data-i="plus"></i> Add Device</button></div>'+tbl(['Customer','Type','IP','MAC','Status','Actions'],r[1].map(function(d){return [esc(cname(d.customerId)),esc(d.type),esc(d.ip),esc(d.mac),bdg(d.status),'<div class="act"><button class="btn sm" onclick="editD(\''+d.id+'\')">Edit</button><button class="btn sm red" onclick="delD(\''+d.id+'\')">Delete</button></div>']}))+'</div>')})};
function setS(id,s){A('admin/customers/'+id,'PUT',{status:s},'Status updated')}
function editD(id){var d=id?D.d.filter(function(x){return x.id===id})[0]:{status:'online',type:'ONU / Router'};
 form(id?'Edit Device':'Add Device',[{k:'customerId',l:'Customer',t:'select',o:D.c.map(function(c){return [c.id,c.cid+' - '+c.name]})},{k:'type',l:'Device type'},{k:'ip',l:'IP address'},{k:'mac',l:'MAC address'},{k:'status',l:'Status',t:'select',o:[['online','Online'],['offline','Offline']]}],d,function(x){return api('admin/devices'+(id?'/'+id:''),id?'PUT':'POST',x).then(done())})}
function delD(id){sure('Delete this device?',function(){A('admin/devices/'+id,'DELETE',null,'Deleted')})}

V.support=function(){return api('admin/tickets').then(function(r){D.t=r;P('Support Tickets','<div class="card">'+tbl(['Ticket','Customer','Subject','Date','Status','Actions'],r.map(function(t){return [t.no,esc(t.customer),esc(t.subject),fdate(t.date),bdg(t.status),'<div class="act"><button class="btn sm" onclick="repT(\''+t.id+'\')">View / Reply</button><button class="btn sm red" onclick="delT(\''+t.id+'\')">Delete</button></div>']}))+'</div>')})};
function repT(id){var t=D.t.filter(function(x){return x.id===id})[0];form('Ticket '+t.no,[{h:'<p><b>'+esc(t.subject)+'</b> from '+esc(t.customer)+'</p><p class="muted">'+esc(t.message)+'</p>'},{k:'reply',l:'Your reply',t:'textarea'},{k:'status',l:'Status',t:'select',o:[['open','Open'],['closed','Closed']]}],t,function(d){return api('admin/tickets/'+id+'/reply','POST',d).then(done('Reply sent'))},'Send')}
function delT(id){sure('Delete this ticket?',function(){A('admin/tickets/'+id,'DELETE',null,'Deleted')})}

V.reports=function(){return api('admin/reports').then(function(r){
 P('Reports','<div class="grid">'+stat('card','Total Collected',money(r.totalCollected))+stat('alert','Total Due',money(r.totalDue))+stat('users','Customers',r.customers)+'</div><div class="two" style="grid-template-columns:1.5fr 1fr"><div class="card"><h3>Billed vs Collected (6 months)</h3>'+bars(r.months,r.billed,r.collected)+'</div><div class="card"><h3>Customers by Package</h3>'+tbl(['Package','Customers'],r.byPackage.map(function(p){return [esc(p.name),p.count]}))+'</div></div><div class="bar2"><button class="btn o2" onclick="exp(\'customers\')">Download Customers CSV</button><button class="btn o2" onclick="exp(\'payments\')">Download Payments CSV</button><button class="btn o2" onclick="exp(\'invoices\')">Download Invoices CSV</button><button class="btn" onclick="window.print()">Print</button></div>')})};
function exp(k){api('admin/'+k).then(function(rows){csv(k,rows)})}

V.settings=function(){return Promise.all([api('admin/settings'),api('admin/announcements')]).then(function(r){var s=r[0];D.a=r[1];
 P('Settings','<div class="two" style="grid-template-columns:1fr 1fr"><div class="card"><h3>Company Info</h3><form id="f1"><label>Company name</label><input name="company" value="'+esc(s.company)+'"><label>Support phone</label><input name="phone" value="'+esc(s.phone)+'"><label>Support email</label><input name="email" value="'+esc(s.email)+'"><label>Address</label><input name="address" value="'+esc(s.address)+'"><div class="mf"><button class="btn">Save</button></div></form></div>'
 +'<div class="card"><h3>Change Admin Password</h3><form id="f2"><label>Current password</label><input name="old" type="password" required><label>New password</label><input name="new" type="password" required minlength="4"><div class="mf"><button class="btn">Change Password</button></div></form></div></div>'
 +'<div class="card" style="margin-top:16px"><h3>Announcements</h3><div class="bar2"><button class="btn" onclick="editA()"><i data-i="plus"></i> New Announcement</button></div>'+tbl(['Title','Message','Date','Action'],r[1].map(function(a){return [esc(a.title),esc(a.text),fdate(a.date),'<button class="btn sm red" onclick="delA(\''+a.id+'\')">Delete</button>']}))+'</div>');
 sub('f1','PUT','admin/settings','Settings saved');sub('f2','POST','admin/password','Password changed')})};
function editA(){form('New Announcement',[{k:'title',l:'Title',r:1},{k:'text',l:'Message',t:'textarea'}],{},function(d){return api('admin/announcements','POST',d).then(done('Posted'))},'Post')}
function delA(id){sure('Delete this announcement?',function(){A('admin/announcements/'+id,'DELETE',null,'Deleted')})}
</script><script src="xlsx.full.min.js"></script><script src="migration.js"></script><script src="premium.js"></script>
<script src="erp.js"></script><script src="unique.js"></script><script src="hub.js"></script><script src="support.js"></script><script src="wizard.js"></script><script src="demo.js"></script><script src="c360.js"></script><script src="wizard2.js"></script><script src="wizard3.js"></script><script src="cwiz.js"></script><script src="upd.js"></script><script>
(function(){
var b=document.getElementById('bkUpd');if(!b)return;
function say(t){alert(t)}
function wait(n){
  fetch('/api/me',{cache:'no-store'}).then(function(r){if(r.status<500){location.reload()}else{throw 0}}).catch(function(){
    if(n>0){setTimeout(function(){wait(n-1)},1500)}else{say('Update installed. Please close and reopen BillKora.')}
  });
}
b.onclick=function(){
  b.disabled=true;var old=b.innerHTML;b.textContent='Checking...';
  fetch('/api/update/check',{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
    if(j.error)throw new Error(j.error);
    if(!j.available){say('You already have the latest version ('+j.current+').');return}
    if(!confirm('Update available: '+j.current+' -> '+j.latest+'\n\n'+(j.notes||'')+'\n\nYour customers, invoices and settings will be kept. Install now?'))return;
    var pw=prompt('Enter your admin password to confirm the update:');
    if(pw===null||pw==='')return;
    b.textContent='Updating...';
    return fetch('/api/update/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})}).then(function(r){return r.json()}).then(function(k){
      if(!k.ok)throw new Error(k.error||'Update failed');
      say('Updated to '+k.version+'. BillKora is restarting. You will need to sign in again.');
      setTimeout(function(){wait(30)},2500);
    });
  }).catch(function(e){say('Update problem: '+e.message)}).then(function(){b.disabled=false;b.innerHTML=old});
};
})();
</script></body></html>
