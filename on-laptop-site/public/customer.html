<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BillKora - My Account</title><link rel="stylesheet" href="style.css"></head><body>
<div class="app"><div class="side"><div class="logo"><img src="logo.png" alt="" style="height:40px;border-radius:8px"><div>BillKora<small>My Account</small></div></div>
<a data-v="dashboard" href="#dashboard"><i data-i="home"></i>Dashboard</a><a data-v="bills" href="#bills"><i data-i="file"></i>My Bills</a><a data-v="payments" href="#payments"><i data-i="card"></i>Payments</a><a data-v="package" href="#package"><i data-i="box"></i>My Package</a><a data-v="support" href="#support"><i data-i="hp"></i>Support</a><a data-v="profile" href="#profile"><i data-i="user"></i>Profile</a>
<a href="#" onclick="logout();return false" style="margin-top:50px"><i data-i="out"></i>Logout</a></div>
<div class="main"><div class="top"><h2 id="ttl">Dashboard</h2><div class="r"><a href="#dashboard" title="Announcements"><i data-i="bell"></i></a><div class="av" id="av">?</div><b id="nm"></b></div></div><div id="v"></div></div></div>
<script src="app.js"></script>
<script>
var V={},D={};
function P(t,h){$('ttl').textContent=t;$('v').innerHTML=h;icons()}
function go(){var c=(location.hash||'#dashboard').slice(1);if(!V[c])c='dashboard';
 document.querySelectorAll('.side a[data-v]').forEach(function(a){a.classList.toggle('on',a.dataset.v===c)});
 V[c]().catch(function(e){if(e.message!=='auth')toast(e.message,1)})}
window.onhashchange=go;
api('me').then(function(j){if(j.role!=='customer'){location.href='admin.html';return}$('nm').textContent=j.name;$('av').textContent=(j.name||'?').charAt(0).toUpperCase();go()});

V.dashboard=function(){return api('c/dashboard').then(function(d){var c=d.customer,p=d.package||{},n=d.nextBill;D.i=d.bills;
 P('Welcome, '+c.name,'<p class="muted" style="margin-bottom:16px">Customer ID: '+esc(c.cid)+'</p><div class="grid">'
 +'<div class="card stat"><span class="ic"><i data-i="wifi"></i></span><div>My Package<b>'+esc(p.name||'-')+'</b>Unlimited</div></div>'
 +'<div class="card stat"><span class="ic"><i data-i="check"></i></span><div>Status<b>'+bdg(c.status)+'</b></div></div>'
 +'<div class="card stat"><span class="ic"><i data-i="clock"></i></span><div>Next Bill<b>'+(n?money(n.amount):'No dues')+'</b>'+(n?'Due on '+n.due+' <button class="btn sm" onclick="payNow(\''+n.id+'\')">Pay Now</button>':'All paid')+'</div></div></div>'
 +'<div class="two" style="grid-template-columns:1.4fr 1fr"><div class="card"><h3>Usage (This Month)</h3><p style="margin:12px 0"><b>'+(c.usage||0)+' GB</b> / Unlimited</p><div class="bar"><div style="width:100%"></div></div></div>'
 +'<div class="card"><h3>Quick Actions</h3><div class="grid" style="margin-top:10px;grid-template-columns:1fr 1fr"><a class="card qa" href="#bills"><span class="ic"><i data-i="card"></i></span>Pay Bill</a><a class="card qa" href="#package"><span class="ic"><i data-i="ref"></i></span>Change Package</a><a class="card qa" href="#support"><span class="ic"><i data-i="hp"></i></span>Raise Support</a><a class="card qa" href="#profile"><span class="ic"><i data-i="user"></i></span>Update Profile</a></div></div></div>'
 +'<div class="two" style="grid-template-columns:1.4fr 1fr"><div class="card"><h3>Recent Bills <a class="lnk" href="#bills">View All</a></h3>'+tbl(['Month','Amount','Status'],d.bills.map(function(i){return [i.month,money(i.amount),bdg(i.status)]}))+'</div>'
 +'<div class="card"><h3>Announcements</h3>'+(d.announcements.length?d.announcements.map(function(a){return '<div class="card" style="background:#e6f0ff;margin-top:10px;box-shadow:none"><b>'+esc(a.title)+'</b><p>'+esc(a.text)+'</p></div>'}).join(''):'<p class="muted">No announcements.</p>')+'</div></div>')})};
function payNow(id){form('Pay Bill',[{h:'<p class="muted">Choose how you paid or want to pay. The bill will be marked as paid.</p>'},{k:'method',l:'Pay with',t:'select',o:METHODS.slice(1)}],{},function(d){d.invoiceId=id;return api('c/pay','POST',d).then(done('Payment successful. Thank you!'))},'Pay Now')}

V.bills=function(){return api('c/bills').then(function(r){D.i=r;P('My Bills','<div class="card">'+tbl(['Invoice','Month','Amount','Due Date','Status','Actions'],r.map(function(i){return [i.no,i.month,money(i.amount),i.due,bdg(i.status),'<div class="act"><button class="btn sm o2" onclick="viewI(\''+i.id+'\')">View</button>'+(i.status==='due'?'<button class="btn sm" onclick="payNow(\''+i.id+'\')">Pay Now</button>':'')+'</div>']}))+'</div>')})};
function viewI(id){invBox(D.i.filter(function(i){return i.id===id})[0])}

V.payments=function(){return api('c/payments').then(function(r){P('Payments','<div class="card">'+tbl(['Receipt','Amount','Method','Date'],r.map(function(p){return [p.no,money(p.amount),esc(p.method),fdate(p.date)]}))+'</div>')})};

V.package=function(){return Promise.all([api('c/dashboard'),api('public')]).then(function(r){var cur=r[0].package||{};
 P('My Package','<div class="card stat" style="max-width:420px"><span class="ic"><i data-i="wifi"></i></span><div>Current plan<b>'+esc(cur.name||'-')+'</b>'+(cur.price?money(cur.price)+' / month':'')+'</div></div><h3 style="margin:20px 0 10px">Change Package</h3><div class="grid">'
 +r[1].packages.map(function(p){return '<div class="card pk"><h3>'+esc(p.name)+'</h3><p>'+esc(p.desc)+'</p><h2>'+money(p.price)+'<small> /mo</small></h2>'+(p.id===cur.id?'<span class="bd l">Current plan</span>':'<button class="btn sm" onclick="chgP(\''+p.id+'\')">Switch to this</button>')+'</div>'}).join('')+'</div>')})};
function chgP(id){sure('Change your package? Your current unpaid bill will be updated to the new price.',function(){A('c/package','POST',{packageId:id},'Package changed')})}

V.support=function(){return api('c/tickets').then(function(r){
 P('Support','<div class="bar2"><button class="btn" onclick="newT()"><i data-i="plus"></i> New Ticket</button><span class="muted">Call us: <b id="sp"></b></span></div>'
 +(r.length?r.map(function(t){return '<div class="tk card"><b>'+esc(t.subject)+'</b> '+bdg(t.status)+' <span class="muted">'+t.no+' - '+fdate(t.date)+'</span><p style="margin:8px 0">'+esc(t.message)+'</p>'+(t.reply?'<div class="card" style="background:#e6f0ff;box-shadow:none"><b>Support reply</b><p>'+esc(t.reply)+'</p></div>':'<p class="muted">Waiting for a reply...</p>')+'</div>'}).join(''):'<div class="card muted">No tickets yet. Click New Ticket if you need help.</div>'));
 api('public').then(function(p){$('sp').textContent=p.phone})})};
function newT(){form('New Support Ticket',[{k:'subject',l:'Subject',r:1},{k:'message',l:'Describe your problem',t:'textarea',r:1}],{},function(d){return api('c/tickets','POST',d).then(done('Ticket submitted'))},'Submit')}

V.profile=function(){return api('c/dashboard').then(function(d){var c=d.customer;
 P('Profile','<div class="two" style="grid-template-columns:1fr 1fr"><div class="card"><h3>My Details</h3><p class="muted">Customer ID: '+esc(c.cid)+' - Username: '+esc(c.username)+'</p><form id="f1"><label>Full name</label><input name="name" required value="'+esc(c.name)+'"><label>Phone</label><input name="phone" value="'+esc(c.phone)+'"><label>Email</label><input name="email" value="'+esc(c.email)+'"><label>Address</label><input name="address" value="'+esc(c.address)+'"><div class="mf"><button class="btn">Update Profile</button></div></form></div>'
 +'<div class="card"><h3>Change Password</h3><form id="f2"><label>Current password</label><input name="old" type="password" required><label>New password</label><input name="new" type="password" required minlength="4"><div class="mf"><button class="btn">Change Password</button></div></form></div></div>');
 sub('f1','PUT','c/profile','Profile updated');sub('f2','POST','c/password','Password changed')})};
</script></body></html>
